services:
  - type: web
    name: api-staging
    runtime: docker
    region: oregon
    plan: starter
    branch: develop
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: staging-secrets
      - key: APP_ENV
        value: staging
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: db-staging
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis-staging
          property: connectionString

  - type: web
    name: api-prod
    runtime: docker
    region: oregon
    plan: starter
    branch: main
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: prod-secrets
      - key: APP_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: db-prod
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis-prod
          property: connectionString

  - type: worker
    name: worker-staging
    runtime: docker
    region: oregon
    plan: starter
    branch: develop
    dockerfilePath: apps/worker/Dockerfile
    envVars:
      - fromGroup: staging-secrets
      - key: APP_ENV
        value: staging
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis-staging
          property: connectionString

  - type: worker
    name: worker-prod
    runtime: docker
    region: oregon
    plan: starter
    branch: main
    dockerfilePath: apps/worker/Dockerfile
    envVars:
      - fromGroup: prod-secrets
      - key: APP_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis-prod
          property: connectionString

  - type: keyvalue
    name: redis-staging
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: keyvalue
    name: redis-prod
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: db-staging
    region: oregon
    plan: starter
  - name: db-prod
    region: oregon
    plan: starter

envVarGroups:
  - name: staging-secrets
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: MIN_PARTIAL_AMOUNT
        value: "10"

  - name: prod-secrets
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: MIN_PARTIAL_AMOUNT
        value: "10"
